<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Investment | Investpedia</title>
<meta name="description" content="Investment reference page">
<style>
:root{--bg:#070b12;--panel:#0d131d;--panel2:#111925;--line:#1e2a39;--text:#eef4fb;--muted:#91a0b4;--accent:#65d6b0;--accent2:#7ea7ff;--danger:#ff8c8c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#15243a 0,transparent 34%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}a{color:inherit;text-decoration:none}
.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 28px;position:sticky;top:0;background:rgba(7,11,18,.88);backdrop-filter:blur(16px);z-index:10}.logo{font-weight:800;font-size:20px}.logo span{color:var(--accent)}.search{flex:1;max-width:650px;margin:auto;position:relative}.search input{width:100%;padding:13px 16px;border:1px solid var(--line);background:#0b111a;color:var(--text);border-radius:12px}.nav{display:flex;gap:18px;color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:235px minmax(0,1fr) 245px;max-width:1500px;margin:auto}.side{padding:28px 20px;border-right:1px solid var(--line);min-height:calc(100vh - 72px)}.right{border-left:1px solid var(--line);border-right:0}.side h4{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#66768c;margin:0 0 13px}.side a{display:block;color:var(--muted);padding:8px 10px;border-radius:8px;font-size:14px}.side a:hover{background:#101a27;color:var(--text)}main{padding:38px 42px 70px}.crumb{font-size:12px;color:#66768c;margin-bottom:14px}.tag{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:1px}.hero h1{font-size:42px;margin:8px 0 10px;letter-spacing:-1px}.hero p{color:var(--muted);line-height:1.65;max-width:800px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 30px}.chip{font-size:12px;color:#b8c7d9;border:1px solid var(--line);background:#0c131e;padding:6px 10px;border-radius:999px}.snap{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.snap .box,.content,.more,.related{border:1px solid var(--line);background:#0d141f;border-radius:14px;padding:18px}.label{font-size:11px;text-transform:uppercase;color:#66768c;letter-spacing:.8px}.value{font-size:16px;font-weight:700;margin-top:8px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin-top:16px}.content h2,.more h2{font-size:18px;margin:0 0 12px}.content p,.content li,.more p{color:#a8b6c8;font-size:13px;line-height:1.7}.example{border-left:3px solid var(--accent);background:#0a1718;padding:14px;margin-top:14px;color:#b7c8c7;font-size:13px;line-height:1.6}.risk{display:grid;grid-template-columns:1fr 1fr;gap:12px}.risk .box{border:1px solid var(--line);border-radius:14px;padding:18px}.risk h3{font-size:14px;margin:0 0 9px}.risk ul{margin:0;padding-left:18px}.more{margin-top:16px}.related{margin-top:16px}.related a{display:inline-block;border:1px solid var(--line);padding:8px 10px;border-radius:9px;color:#b6c6d9;font-size:12px;margin:4px}.sideblock{margin-bottom:30px}.sideblock h3{font-size:13px}.sideblock a{padding:7px 0}.footer{border-top:1px solid var(--line);margin-top:40px;padding-top:20px;color:#68778b;font-size:12px}
@media(max-width:1050px){.layout{grid-template-columns:190px minmax(0,1fr)}.right{display:none}.snap{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:720px){.top{height:auto;padding:12px 15px;flex-wrap:wrap}.search{order:3;flex-basis:100%}.nav{display:none}.layout{display:block}.side{display:none}main{padding:28px 16px}.hero h1{font-size:34px}.snap{grid-template-columns:1fr 1fr}.risk{grid-template-columns:1fr}}
</style>
<script type="application/ld+json" id="jsonld"></script>
</head>
<body>
<header class="top"><a class="logo" href="../../">Invest<span>pedia</span></a><div class="search"><input placeholder="Search investments, topics, or keywords…" onkeydown="if(event.key==='Enter')location.href='../../?q='+encodeURIComponent(this.value)"></div><div class="nav"><a href="../../">Home</a><a href="../../#categories">Categories</a><a href="../../#discover">Discover</a><a href="../../#about">About</a></div></header>
<div class="layout">
<aside class="side"><h4>Explore</h4><a href="../../">All Investments</a><a href="../../#categories">Categories</a><a href="../../#discover">Advanced Discovery</a><h4 style="margin-top:28px">Core</h4><a href="../../#results">Equity</a><a href="../../#results">Fixed Income</a><a href="../../#results">Funds</a><a href="../../#results">Cash & Deposits</a><a href="../../#results">Commodities</a></aside>
<main id="app"></main>
<aside class="side right"><div class="sideblock"><h3>Quick Links</h3><a href="#overview">Overview</a><a href="#rewards">Rewards & Risks</a><a href="#details">More Details</a></div><div class="sideblock"><h3>Explore</h3><a href="../../">All investments</a><a href="../../#discover">Advanced discovery</a></div></aside>
</div>
<script>
const slug=location.pathname.split("/").filter(Boolean).pop();
async function init(){
 const data=await (await fetch("../../data/investments.json")).json();
 const x=data.find(i=>i.slug===slug);
 if(!x){document.title="Investment not found | Investpedia";document.getElementById("app").innerHTML='<h1>Investment not found</h1><p><a href="../../">Return to the investment database.</a></p>';return;}
 document.title=x.name+" — Investment Reference | Investpedia";
 document.querySelector('meta[name="description"]').content=x.description;
 const related=data.filter(i=>x.related.includes(i.id));
 document.getElementById("jsonld").textContent=JSON.stringify({"@context":"https://schema.org","@type":"Article","name":x.name+" — Investment Reference","description":x.description,"about":{"@type":"Thing","name":x.name},"keywords":x.keywords.join(", ")});
 document.getElementById("app").innerHTML=`
 <div class="crumb">Home / ${x.category} / ${x.name}</div>
 <section class="hero"><div class="tag">${x.category}</div><h1>${x.name}</h1><p>${x.description}</p><div class="chips">${x.country.map(v=>`<span class="chip">${v}</span>`).join("")}${x.keywords.slice(0,3).map(v=>`<span class="chip">${v}</span>`).join("")}</div></section>
 <section class="snap" id="overview">
  <div class="box"><div class="label">Risk</div><div class="value">${x.risk}</div></div>
  <div class="box"><div class="label">Return</div><div class="value">${x.return_type.join(" + ")}</div></div>
  <div class="box"><div class="label">Liquidity</div><div class="value">${x.liquidity}</div></div>
  <div class="box"><div class="label">Time Horizon</div><div class="value">${x.time_horizon}</div></div>
 </section>
 <div class="grid">
  <div>
   <section class="content"><h2>What it is & how it works</h2><p>${x.description}</p><p>The exact way an investment works depends on its instrument, issuer, market and terms. This database page is designed to give a quick reference first, with deeper verified details added as the database expands.</p><div class="example"><strong>Example:</strong> An investor allocates money to ${x.name.toLowerCase()} and may receive returns through ${x.return_type.join(" or ")}. The outcome depends on the asset's price, cash flows, costs, taxes and the time it is held.</div></section>
   <section class="content" id="rewards"><h2>Potential Rewards</h2><ul><li>Potential for ${x.return_type.join(" and ").toLowerCase()}.</li><li>Can have a role within a diversified portfolio.</li><li>Outcome varies with market conditions and the specific investment.</li></ul></section>
   <section class="risk"><div class="box"><h3>Key Risks</h3><ul><li>Market and price risk.</li><li>Returns are not guaranteed unless specifically stated by the product.</li><li>Costs, taxes and liquidity can affect the final outcome.</li></ul></div><div class="box"><h3>Best suited for</h3><p>Investors whose goals, risk tolerance, liquidity needs and time horizon fit this investment type.</p></div></section>
   <section class="more" id="details"><h2>More Details</h2><p><strong>Category:</strong> ${x.category}</p><p><strong>Countries/regions:</strong> ${x.country.join(", ")}</p><p><strong>Search terms:</strong> ${x.keywords.join(", ")}</p><p><strong>Important:</strong> Risk classifications are relative reference labels, not guarantees. Product-specific details should be checked against current official documents before investing.</p></section>
   ${related.length?`<section class="related"><h2>Related Investments</h2>${related.map(r=>`<a href="../${r.slug}/">${r.name}</a>`).join("")}</section>`:""}
  </div>
 </div>
 <div class="footer">Investpedia Investment Database · Reference content should be verified before financial decisions.</div>`;
}
init();
</script>
</body></html>
